# Lançamento: git tag -a v1.2.3 -m "changelog" && git push origin v1.2.3
# Compila com a versão da tag, cria o GitHub Release e publica no Modrinth.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}"

      # O checkout não traz a mensagem da tag anotada; ela vira o changelog.
      - name: Changelog
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > changelog.md
          cat changelog.md

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: eYOBjKLB
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.jar
          name: Simple MusicBox ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: changelog.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: fabric-api(required)

# Done to increase the memory available to gradle.
# java.io.tmpdir precisa ser executável: o Gradle e o LavaPlayer extraem libs nativas nele
# (em alguns sistemas /tmp é montado com noexec).
org.gradle.jvmargs=-Xmx2G -Djava.io.tmpdir=/home/duck/.gradle/tmp
org.gradle.parallel=true
org.gradle.vfs.watch=false


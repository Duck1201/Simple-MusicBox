# Done to increase the memory available to gradle.
# Se o /tmp da sua máquina for noexec, aponte o tmpdir para um diretório executável
# no ~/.gradle/gradle.properties (o Gradle e o LavaPlayer extraem libs nativas nele):
#   org.gradle.jvmargs=-Xmx2G -Djava.io.tmpdir=/caminho/executavel
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.vfs.watch=false

